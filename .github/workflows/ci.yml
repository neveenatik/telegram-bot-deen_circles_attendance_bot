name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Provide a real Chrome so the browser-gated image-render tests actually
      # run in CI instead of skipping (the render engine points at
      # PUPPETEER_EXECUTABLE_PATH before its other candidates).
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  # Apply database migrations after CI passes, on merges to master only.
  # The existing schema_migrations table is the ledger: version = filename
  # without ".sql". Each file is applied at most once (skipped if its version
  # is already recorded) and its version is recorded after it runs. Fresh
  # databases are built from scripts/supabase_v2.sql, not from this folder.
  migrate:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL secret is not set" >&2
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "create table if not exists schema_migrations (
               version text primary key,
               applied_at timestamptz not null default now()
             );"

          for f in scripts/migrations/*.sql; do
            version=$(basename "$f" .sql)
            applied=$(psql "$SUPABASE_DB_URL" -tAc "select 1 from schema_migrations where version = '$version'")
            if [ "$applied" = "1" ]; then
              echo "skip   $version"
              continue
            fi
            echo "apply  $version"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "insert into schema_migrations (version) values ('$version') on conflict do nothing;"
          done

  # Deploy to Vercel only after migrations succeed, so the schema is always in
  # place before the new code goes live. Requires disabling Vercel's automatic
  # Git deploy (Settings → Git → Ignored Build Step → `exit 0`).
  deploy:
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to production
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
